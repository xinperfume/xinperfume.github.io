<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe8e4">
<title>XIN歆星香水/流行代購</title>
<meta name="description" content="香水、美妝、流行代購，LINE 登入即可下單。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://xinperfume.github.io/">
<meta property="og:title" content="XIN歆星香水/流行代購">
<meta property="og:description" content="香水、美妝、流行代購，LINE 登入即可下單。">
<meta property="og:image" content="https://xinperfume.github.io/logo.jpg">
<meta property="og:image:width" content="640">
<meta property="og:image:height" content="640">
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://wsrv.nl">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=7">
<script src="config.js"></script>
<script src="common.js?v=2"></script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <h1 id="shopname">XIN歆星香水/流行代購</h1>
      <div class="who" id="who" hidden></div>
    </div>
  </div>
</header>
<main class="wrap">
  <section id="view-shop">
    <div id="notice" class="notice" hidden></div>
    <div id="addfriend" class="notice friendbar" hidden><span>加入官方帳號好友，付款確認和出貨時會用 LINE 通知你</span><a class="btn small" id="af-go" href="https://line.me/R/ti/p/@xinperfume">加好友</a><button type="button" class="af-x" id="af-x" aria-label="先不要">×</button></div>
    <div id="shopinfo" class="card-box shopinfo" hidden></div>
    <div class="tools">
      <div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="搜尋商品名稱、品牌" aria-label="搜尋商品"></div>
      <div class="cats" id="cats" role="tablist" aria-label="商品分類"></div>
      <div class="sortbar"><span class="hint" id="count"></span>
        <div class="seg" role="group" aria-label="排序">
          <button type="button" data-sort="new" aria-pressed="true">最新</button>
          <button type="button" data-sort="hot" aria-pressed="false">熱銷</button>
        </div>
      </div>
    </div>
    <div id="plist"><div class="loading">商品載入中…</div></div>
  </section>
  <section id="view-mine" hidden>
    <div class="panel" id="lookup" hidden>
      <h3>查詢訂購紀錄</h3>
      <form id="lf" class="report">
        <div class="field"><label for="l-phone">下單時填的手機號碼</label><input id="l-phone" inputmode="numeric" placeholder="0912345678" autocomplete="tel"></div>
        <button class="btn" id="lsub">查詢</button>
      </form>
      <div class="err" id="lerr"></div>
    </div>
    <div id="mresult"></div>
  </section>
  <section id="view-member" hidden></section>
</main>

<nav class="bottomnav" aria-label="主選單">
  <div class="wrap" role="tablist">
    <button class="navbtn" role="tab" data-view="shop" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5h16v1a3 3 0 0 1-5.3 1.9A3 3 0 0 1 12 13.5a3 3 0 0 1-2.7-1.1A3 3 0 0 1 4 10.5z"/><path d="M5.5 13v7h13v-7"/></svg>逛賣場</button>
    <button class="navbtn" data-view="cart">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h3l2.4 11.5h11l2-8H7"/></svg>購物車<span class="badge" id="badge" hidden>0</span></button>
    <button class="navbtn" role="tab" data-view="mine" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>訂購紀錄</button>
    <button class="navbtn" role="tab" data-view="member" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4.2 4.3-6 8-6s6.8 1.8 8 6"/></svg>會員</button>
  </div>
</nav>
<div id="sheet-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
const S = { products: [], categories: [], settings: {}, cart: [], me: null, idToken: null, phone: "", view: "shop",
  q: "", cat: "", sort: "new", opened: false };
try { S.cart = JSON.parse(localStorage.getItem("cart") || "[]"); } catch (_) {}
const isLine = () => !!(S.me && S.me.line);
const ident = () => isLine() ? { idToken: S.idToken } : { phone: S.phone };
const ICON = {
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4.2 4.3-6 8-6s6.8 1.8 8 6"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};
function guest() { try { return JSON.parse(localStorage.getItem("buyer") || "{}"); } catch (_) { return {}; } }
function saveCart() { try { localStorage.setItem("cart", JSON.stringify(S.cart)); } catch (_) {} renderBadge(); }
function closeSheet() { $("#sheet-root").innerHTML = ""; }
function openSheet(html) {
  $("#sheet-root").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeSheet(); });
}
function pickups() { return String(S.settings["取貨方式"] || "面交").split(/[,，、]/).map(s => s.trim()).filter(Boolean); }

/* ---------- 超商選門市（綠界電子地圖） ---------- */
// [綠界代碼, 顯示名稱, 取貨方式文字比對]；取貨方式只寫「超商取貨」時，開放前三家
const CVS = [["UNIMART", "7-11", /7-?11|統一|小七/], ["FAMI", "全家", /全家/], ["HILIFE", "萊爾富", /萊爾富/], ["OKMART", "OK", /\bOK\b/i]];
try { S.store = JSON.parse(localStorage.getItem("cvsStore") || "null"); } catch (_) {}
const pickBase = p => String(p || "").split("｜")[0];
function cvsBrands(opt) {
  const hit = CVS.filter(c => c[2].test(opt || ""));
  return hit.length ? hit : /超商/.test(opt || "") ? CVS.slice(0, 3) : [];
}
function storeFor(opt) {
  const st = S.store, b = st && cvsBrands(opt).find(c => st.sub.replace("C2C", "") === c[0]);
  return b ? Object.assign({ brand: b[1] }, st) : null;
}
// 超商取貨還沒選門市的話，回傳空字串
function pickupText(opt) {
  if (!cvsBrands(opt).length) return opt;
  const st = storeFor(opt);
  return st ? `${opt}｜${st.brand} ${st.name || ""}（店號 ${st.id}）${st.addr ? " " + st.addr : ""}` : "";
}
function cvsBox(opt) {
  const brands = cvsBrands(opt);
  if (!brands.length) return "";
  const st = storeFor(opt);
  return `<div class="cvsbox">${st ? `<div class="hint">取貨門市</div><b>${esc(st.brand)} ${esc(st.name || "")}</b><div class="hint">店號 ${esc(st.id)}${st.addr ? "・" + esc(st.addr) : ""}</div>` : `<div class="hint">請選擇取貨門市</div>`}
    <div class="actions" style="justify-content:flex-start;margin-top:6px">${brands.map(c => `<button type="button" class="btn small ghost" data-cvs="${c[0]}">${st ? "改選" : "選"} ${esc(c[1])} 門市</button>`).join("")}</div></div>`;
}
function openCvsMap(sub, draft) {
  try { sessionStorage.setItem("ckdraft", JSON.stringify(draft)); } catch (_) {}
  const id = String(S.settings["綠界商店代號"] || "").trim();
  const f = document.createElement("form");
  f.method = "post";
  // 優先用新視窗開地圖，選好後門市直接傳回這頁；新視窗被擋時，才整頁跳過去
  const w = window.open("", "cvsmap");
  if (w) { f.target = "cvsmap"; S.cvsWin = w; }
  // 沒填綠界商店代號時用綠界測試環境
  f.action = id ? "https://logistics.ecpay.com.tw/Express/map" : "https://logistics-stage.ecpay.com.tw/Express/map";
  const fields = { MerchantID: id || "2000933", LogisticsType: "CVS", LogisticsSubType: sub + "C2C", IsCollection: "N",
    ServerReplyURL: CFG.API_URL, ExtraData: "xin", Device: sub !== "FAMI" && /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 1 : 0 };
  Object.keys(fields).forEach(k => { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = fields[k]; f.appendChild(i); });
  document.body.appendChild(f); f.submit();
}
function setStore(st) {
  Object.keys(st).forEach(k => st[k] = String(st[k] || "").trim());
  S.store = st;
  try { localStorage.setItem("cvsStore", JSON.stringify(st)); } catch (_) {}
}
// 新視窗選好門市後，Apps Script 回傳頁會把門市資料傳到這裡
window.addEventListener("message", e => {
  if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin) || !e.data || !e.data.cvs) return;
  setStore(e.data.cvs);
  try { if (S.cvsWin) S.cvsWin.close(); } catch (_) {}
  const sel = $("#f-pick"); if (sel && sel.onchange) sel.onchange();
  toast("已選好門市");
});
// 從地圖回來時，網址 # 後面帶著門市資料
function takeCvsReturn() {
  const m = location.hash.match(/^#cvs=(.+)$/);
  if (!m) return null;
  history.replaceState(null, "", location.pathname + location.search);
  try {
    setStore(JSON.parse(decodeURIComponent(m[1])));
    return JSON.parse(sessionStorage.getItem("ckdraft") || "null") || {};
  } catch (_) { return {}; }
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("LINE 登入元件載入失敗")); document.head.appendChild(s); });
}
// an expired LINE token: sign in again and come back to this page
function relogin() { try { liff.logout(); } catch (_) {} liff.login({ redirectUri: location.href }); }
function handle(err, el) {
  const m = errMsg(err);
  if (isLine() && /LINE 登入/.test(m)) { toast("LINE 登入過期，重新登入中…"); setTimeout(relogin, 800); return; }
  if (el) el.textContent = m; else toast(m);
}

/* ---------- 導覽 ---------- */
document.querySelectorAll(".navbtn").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.view === "cart") {
    if (S.cart.length) openCheckout(false); else toast("購物車是空的，先去逛逛吧");
    return;
  }
  show(b.dataset.view);
}));
function show(view) {
  S.view = view;
  document.querySelectorAll(".navbtn[role=tab]").forEach(x => x.setAttribute("aria-selected", x.dataset.view === view));
  ["shop", "mine", "member"].forEach(v => $("#view-" + v).hidden = v !== view);
  scrollTo(0, 0);
  if (view === "mine") {
    $("#lookup").hidden = isLine();
    if (isLine() || S.phone) loadMine(); else $("#mresult").innerHTML = "";
  }
  if (view === "member") renderMember(false);
}

/* ---------- 逛賣場 ---------- */
// 先用上次存下的商品畫出來，後端回來後資料有變才重畫
function load() {
  let cached = null;
  try { cached = localStorage.getItem("shopCache"); } catch (_) {}
  if (cached) { try { showShop(JSON.parse(cached), true); } catch (_) { cached = null; } }
  return api("getShop").then(d => {
    const fresh = JSON.stringify(d);
    if (fresh !== cached) showShop(d);
    try { localStorage.setItem("shopCache", fresh); } catch (_) {}
  }).catch(e => { if (!cached) $("#plist").innerHTML = `<div class="empty">載入失敗：${esc(errMsg(e))}</div>`; });
}

function showShop(d, fromCache) {
  S.products = d.products.map(normProduct); S.settings = d.settings;
  const name = S.settings["店名"] || "XIN歆星香水/流行代購";
  document.title = name; $("#shopname").textContent = name;
  const n = $("#notice"); n.hidden = !S.settings["公告"]; n.textContent = S.settings["公告"] || "";
  const pills = (S.settings["帳號"] ? ["可匯款"] : []).concat(pickups());
  const info = $("#shopinfo"); info.hidden = !pills.length;
  info.innerHTML = `<div class="pills">${pills.map(p => `<span class="pill">${esc(p)}</span>`).join("")}</div>`;
  S.categories = d.categories || [];
  if (S.cat && S.categories.indexOf(S.cat) < 0) S.cat = "";
  // 舊快取可能少了新商品，購物車只用後端最新資料來清
  if (!fromCache) { S.cart = S.cart.filter(c => S.products.some(p => p.id === c.pid)); saveCart(); }
  renderCats(); renderShop();
  // 網址帶 ?p=商品ID 時，直接打開那件商品
  const pid = new URLSearchParams(location.search).get("p");
  if (pid && !S.opened) { S.opened = true; if (S.products.some(p => p.id === pid)) openProduct(pid); }
}

function priceText(p) {
  const ps = p.variants.map(v => v.price);
  const lo = Math.min.apply(null, ps.length ? ps : [p.price]), hi = Math.max.apply(null, ps.length ? ps : [p.price]);
  if (!hi) return "價格待確認";
  return lo === hi ? money(lo) : `${money(lo)} ~ ${money(hi)}`;
}
// 剩這麼多件以下就提醒「只剩幾件」
const LOW_STOCK = 5;
// 結單日當天 23:59 台灣時間才結單，和後端 isClosed_ 一致
function closeLeft(p) {
  if (!p.closeAt || p.closed) return -1;
  return new Date(p.closeAt + "T23:59:59+08:00") - Date.now();
}
function closeShort(p) {
  const ms = closeLeft(p);
  if (ms < 0) return "";
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5);
  return `<span class="chip ${d < 1 ? "hot" : "cd"}">⏰ ${d >= 1 ? `剩 ${d} 天結單` : h >= 1 ? `剩 ${h} 小時結單` : "即將結單"}</span>`;
}
function closeLong(p) {
  const ms = closeLeft(p);
  if (ms < 0) return "";
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  const wd = "日一二三四五六"[new Date(p.closeAt + "T12:00:00+08:00").getDay()];
  return `${p.closeAt.slice(5).replace("-", "/")}（${wd}）23:59 結單，還剩 ${d ? d + " 天 " : ""}${d || h ? h + " 小時 " : ""}${m} 分`;
}

function stockTag(p) {
  const left = p.variants.reduce((a, v) => a + v.stockLeft, 0);
  if (p.closed) return `<span class="chip off">已結單</span>`;
  if (left > 0) return `<span class="chip ok">現貨</span>` + (left <= LOW_STOCK ? `<span class="chip hot">只剩 ${left} 件</span>` : "");
  return p.preorder ? `<span class="chip pre">可預購</span>` : `<span class="chip off">售完</span>`;
}

function renderCats() {
  const el = $("#cats");
  el.hidden = !S.categories.length;
  el.innerHTML = ["", ...S.categories].map(c => `<button type="button" role="tab" data-cat="${esc(c)}" aria-selected="${c === S.cat}">${esc(c || "全部")}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { S.cat = b.dataset.cat; renderCats(); renderShop(); }));
}
$("#q").addEventListener("input", e => { S.q = e.target.value.trim().toLowerCase(); renderShop(); });
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  S.sort = b.dataset.sort;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderShop();
}));

function renderShop() {
  if (!S.products.length) { $("#count").textContent = ""; $("#plist").innerHTML = `<div class="empty">目前沒有上架的商品，請稍後再來看看。</div>`; return; }
  let list = S.products.filter(p => (!S.cat || p.category === S.cat) &&
    (!S.q || (p.title + " " + p.desc).toLowerCase().indexOf(S.q) >= 0));
  list = list.slice().sort(S.sort === "hot" ? (a, b) => b.sold - a.sold || b.createdAt - a.createdAt : (a, b) => b.createdAt - a.createdAt);
  $("#count").textContent = `共 ${list.length} 件商品`;
  if (!list.length) { $("#plist").innerHTML = `<div class="empty">找不到符合的商品，換個關鍵字或分類試試。</div>`; return; }
  $("#plist").innerHTML = `<div class="grid">${list.map(p => `<button class="card" data-pid="${esc(p.id)}"><div class="ph">${photo(p, true)}</div><div class="info">
      <div class="name">${esc(p.title)}</div><div class="price${priceText(p) === "價格待確認" ? " tbd" : ""}">${priceText(p)}</div>
      <div class="meta">${stockTag(p)}${closeShort(p)}</div>
      ${p.sold ? `<div class="sold">已售 ${p.sold}</div>` : ""}</div></button>`).join("")}</div>`;
  document.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => openProduct(c.dataset.pid)));
}

function gallery(p) {
  if (p.images.length < 2) return `<div class="ph">${photo(p)}</div>`;
  // 不用 lazy：LINE 內建瀏覽器在橫向捲動區常常不載入後面的照片
  return `<div class="gallery"><div class="gwrap"><div class="slides" id="slides">${p.images.map((u, i) => `<div class="ph"><img src="${esc(u)}" alt="${esc(p.title)} 第 ${i + 1} 張" referrerpolicy="no-referrer"></div>`).join("")}</div>
    <button type="button" class="gnav prev" data-g="-1" aria-label="上一張">‹</button><button type="button" class="gnav next" data-g="1" aria-label="下一張">›</button>
    <span class="gcount" id="gcount">1 / ${p.images.length}</span></div>
    <div class="gthumbs" id="dots">${p.images.map((u, i) => `<button type="button" class="${i ? "" : "on"}" data-gi="${i}" aria-label="第 ${i + 1} 張"><img src="${esc(u)}" alt="" referrerpolicy="no-referrer"></button>`).join("")}</div></div>`;
}

function inCart(pid, variant) { const c = S.cart.find(x => x.pid === pid && x.variant === variant); return c ? c.qty : 0; }

function openProduct(pid) {
  const p = S.products.find(x => x.id === pid); if (!p) return;
  const qty = {};
  // 價格還沒填（0 元）的商品只能看、不能下單
  const tbd = !p.variants.some(v => v.price) && !p.price;
  const vNote = v => {
    const r = v.left - inCart(p.id, v.name);
    if (r <= 0) return v.left === 0 ? "售完" : "已全部在購物車";
    if (v.stockLeft === 0 && p.preorder) return "預購";
    return v.stockLeft <= LOW_STOCK ? `只剩 ${v.stockLeft} 件` : "";
  };
  openSheet(`${gallery(p)}
    <div class="tags">${p.category ? `<span class="chip">#${esc(p.category)}</span>` : ""}${p.preorder ? `<span class="chip pre">#允許預購</span>` : ""}${p.sold ? `<span class="chip off">已售 ${p.sold}</span>` : ""}</div>
    <h2>${esc(p.title)}</h2><div class="price${priceText(p) === "價格待確認" ? " tbd" : ""}">${priceText(p)}</div>
    ${closeLeft(p) >= 0 ? `<div class="countdown${closeLeft(p) < 864e5 ? " soon" : ""}" id="cd">⏰ ${closeLong(p)}</div>` : ""}
    <div class="label">選擇規格與數量</div>
    <div class="variants">${p.variants.map((v, i) => { const r = v.left - inCart(p.id, v.name); return `<div class="vrow ${r <= 0 ? "out" : ""}">
      <div><div>${esc(v.name)}　<b class="vprice">${tbd ? "價格待確認" : "$" + money(v.price)}</b></div><div class="left">${vNote(v)}${v.left === 0 && isLine() && !p.closed ? ` <button type="button" class="linkbtn" data-notify="${esc(v.name)}">到貨通知我</button>` : ""}</div></div>
      <div class="stepper"><button type="button" data-i="${i}" data-d="-1" aria-label="減少">−</button><span id="q${i}">0</span><button type="button" data-i="${i}" data-d="1" aria-label="增加" ${r <= 0 || p.closed || tbd ? "disabled" : ""}>+</button></div></div>`; }).join("")}</div>
    <div class="total"><span>小計</span><span class="price" id="tot">0</span></div>
    <div class="actions"><button class="btn ghost" id="cl">關閉</button><button class="btn" id="add" ${p.closed || tbd ? "disabled" : ""}>${tbd ? "價格待確認" : p.closed ? "已結單" : "加入購物車"}</button></div>
    ${p.desc ? `<div class="label">商品說明</div><div class="desc">${esc(p.desc)}</div>` : ""}`);
  const sl = $("#slides");
  if (sl) {
    const cur = () => Math.round(sl.scrollLeft / sl.clientWidth);
    const go = i => sl.scrollTo({ left: Math.max(0, Math.min(p.images.length - 1, i)) * sl.clientWidth, behavior: "smooth" });
    sl.addEventListener("scroll", () => {
      const i = cur();
      document.querySelectorAll("#dots button").forEach((d, j) => d.className = i === j ? "on" : "");
      $("#gcount").textContent = `${i + 1} / ${p.images.length}`;
    });
    document.querySelectorAll(".gnav").forEach(b => b.onclick = () => go(cur() + +b.dataset.g));
    document.querySelectorAll("#dots button").forEach(b => b.onclick = () => go(+b.dataset.gi));
  }
  const upd = () => { let t = 0; p.variants.forEach((v, i) => { $("#q" + i).textContent = qty[i] || 0; t += (qty[i] || 0) * v.price; }); $("#tot").textContent = money(t); };
  document.querySelectorAll(".stepper button").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i, v = p.variants[i], max = v.left - inCart(p.id, v.name);
    qty[i] = Math.max(0, Math.min(max, (qty[i] || 0) + +b.dataset.d)); upd();
  }));
  // 倒數每 30 秒更新；商品頁關掉（#cd 不在了）就停
  clearInterval(S.cdTimer);
  if ($("#cd")) S.cdTimer = setInterval(() => { const el = $("#cd"); if (!el) return clearInterval(S.cdTimer); el.textContent = "⏰ " + closeLong(p); }, 30000);
  document.querySelectorAll("[data-notify]").forEach(b => b.onclick = () => {
    b.disabled = true;
    api("subscribeRestock", { idToken: S.idToken, pid: p.id, variant: b.dataset.notify })
      .then(() => { b.textContent = "補貨時會用 LINE 通知你"; }, e => { b.disabled = false; toast(errMsg(e)); });
  });
  $("#cl").onclick = closeSheet;
  $("#add").onclick = () => {
    const add = p.variants.map((v, i) => ({ pid: p.id, variant: v.name, qty: qty[i] || 0 })).filter(x => x.qty > 0);
    if (!add.length) { toast("請先選擇規格和數量"); return; }
    add.forEach(a => { const c = S.cart.find(x => x.pid === a.pid && x.variant === a.variant); if (c) c.qty += a.qty; else S.cart.push(a); });
    saveCart(); closeSheet(); toast("已加入購物車");
  };
}

function cartLines() {
  return S.cart.map(c => {
    const p = S.products.find(x => x.id === c.pid) || { variants: [] };
    const v = p.variants.find(x => x.name === c.variant);
    return Object.assign({}, c, { title: p.title, price: v ? v.price : (p.price || 0) });
  });
}
function renderBadge() {

// 和後端 團購加值.gs 的規則一樣：超商取貨收運費、滿額免運、面交免運
function calcCharges(subtotal, pickup, coupon) {
  const s = S.settings, num = (v, d) => (v === "" || v == null || isNaN(+v) ? d : +v);
  const fee0 = num(s["超商運費"], 60), free = num(s["免運門檻"], 1500);
  const cvs = /超商|7-?11|全家|萊爾富|OK|賣貨便|好賣/i.test(pickup || "");
  const discount = coupon ? Math.min(coupon.discount || 0, subtotal) : 0;
  let fee = 0, feeNote = "";
  if (cvs) {
    if (coupon && coupon.freeShip) feeNote = "免運券";
    else if (subtotal >= free) feeNote = `滿 $${money(free)} 免運`;
    else { fee = fee0; feeNote = `再買 $${money(free - subtotal)} 免運`; }
  } else feeNote = "面交免運";
  return { fee, discount, feeNote };
}

// 還沒加官方帳號好友的話，收不到訂單的 LINE 通知；按 × 之後 3 天內不再提醒
const AF_SNOOZE = 3 * 864e5;
function checkFriend() {
  const bar = $("#addfriend");
  let snoozed = 0;
  try { snoozed = Number(localStorage.getItem("afSnooze")) || 0; } catch (_) {}
  if (!liff.getFriendship || Date.now() - snoozed < AF_SNOOZE) return;
  liff.getFriendship().then(f => { bar.hidden = !!f.friendFlag; }, () => {});
}
function initFriendBar() {
  $("#af-x").onclick = () => { $("#addfriend").hidden = true; try { localStorage.setItem("afSnooze", String(Date.now())); } catch (_) {} };
  $("#af-go").onclick = () => { $("#addfriend").hidden = true; };
  // 加完好友回到這頁時再查一次，加好了就不再顯示
  document.addEventListener("visibilitychange", () => { if (!document.hidden && isLine()) checkFriend(); });
  checkFriend();

// 記一筆逛網站人數：只送瀏覽器裡的隨機代號，不含個資；同一個分頁只記一次，賣家自己的瀏覽器不算
function trackVisit() {
  try {
    if (localStorage.getItem("xin_notrack") || sessionStorage.getItem("xin_hit")) return;
    let v = localStorage.getItem("xin_vid");
    if (!v) { v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("xin_vid", v); }
    sessionStorage.setItem("xin_hit", "1");
    api("hit", { vid: v, page: new URLSearchParams(location.search).get("p") ? "商品" : "首頁" }).catch(() => {});
  } catch (_) {}
}
async function boot() {
  trackVisit();
  let back = takeCvsReturn();
  // 商品和 LINE 登入同時開始載入，不用等登入完才讀商品
  const shopReady = load();
  renderBadge();
  const g = guest(); if (g.phone) { $("#l-phone").value = g.phone; S.phone = g.phone; }
  if (CFG.LIFF_ID) {
    try {
      if (!window.liff) await loadScript("https://static.line-scdn.net/liff/edge/2/sdk.js");
      await liff.init({ liffId: CFG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      S.idToken = liff.getIDToken();
      S.me = await api("me", { idToken: S.idToken });
      if (S.me.line) { renderWho(); initFriendBar(); }
      // 沒登入 LINE 時，門市資料會先跟著 LINE 登入繞一圈，liff.init 之後才回到網址上
      if (!back) back = takeCvsReturn();
    } catch (e) {
      if (/LINE 登入已過期/.test(errMsg(e))) { relogin(); return; }
      const n = $("#notice"); n.hidden = false; n.textContent = "LINE 登入沒有成功（" + errMsg(e) + "），請關掉頁面重新打開。";
    }
  }
  shopReady.then(() => {
    if (!back || !S.cart.length) return;
    openCheckout(!!back.editing && isLine());
    const put = (id, v) => { const el = $(id); if (el && v != null && v !== "") el.value = v; };
    put("#f-name", back.name); put("#f-phone", back.phone); put("#f-line", back.line); put("#f-pick", back.pick); put("#f-note", back.note);
    if ($("#f-pick")) $("#f-pick").onchange();
    toast("已選好門市");
  });
}
