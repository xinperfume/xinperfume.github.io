<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>賣家後台｜XIN歆星香水/流行代購</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=8">
<script src="config.js"></script>
<script src="common.js?v=2"></script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar"><h1 id="shopname">XIN歆星香水/流行代購<small>賣家後台</small></h1><a id="sheetlink" class="hint" target="_blank" rel="noopener" hidden>試算表 ↗</a></div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" aria-selected="true" data-view="orders">訂單</button>
      <button class="tab" role="tab" aria-selected="false" data-view="products">商品</button>
      <button class="tab" role="tab" aria-selected="false" data-view="settings">收款與設定</button>
      <button class="tab" role="tab" aria-selected="false" data-view="traffic">逛網站人數</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="view-login" class="panel" style="max-width:420px;margin:40px auto">
    <h3>賣家登入</h3>
    <form id="loginf">
      <div class="field"><label for="pw">管理密碼</label><input id="pw" type="password" required autocomplete="current-password"></div>
      <div class="err" id="loginerr"></div>
      <button class="btn block" id="loginbtn">登入</button>
    </form>
    <p class="hint">密碼設定在 Google 試算表「設定」工作表的「管理密碼」那一列。</p>
  </section>
  <section id="view-orders" hidden></section>
  <section id="view-products" hidden></section>
  <section id="view-settings" hidden></section>
  <section id="view-traffic" hidden></section>
</main>
<div id="toast" class="toast" hidden></div>

<script>
const A = { token: null, data: null, view: "orders", filter: "全部", editing: null };
// 登入狀態存在 localStorage，同一個瀏覽器的後台分頁都共用，不用每個分頁各登入一次
try { A.token = localStorage.getItem("adm") || null; } catch (_) {}
window.addEventListener("storage", e => { if (e.key === "adm" && e.newValue && !A.data) { A.token = e.newValue; refresh(); } });

$("#loginf").addEventListener("submit", e => {
  e.preventDefault(); $("#loginbtn").disabled = true; $("#loginerr").textContent = "";
  api("adminLogin", { password: $("#pw").value }).then(t => {
    A.token = t; try { localStorage.setItem("adm", t); localStorage.setItem("xin_notrack", "1"); } catch (_) {}
    return refresh();
  }).catch(err => { $("#loginerr").textContent = errMsg(err); }).then(() => { $("#loginbtn").disabled = false; });
});
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { A.view = t.dataset.view; render(); }));

function call(action, data) {
  return api(action, Object.assign({ token: A.token }, data || {})).catch(err => {
    if (/登入已過期/.test(errMsg(err))) { A.token = null; A.data = null; try { localStorage.removeItem("adm"); } catch (_) {} render(); }
    throw err;
  });
}
function refresh() {
  return call("adminData").then(d => {
    A.data = d; d.products = d.products.map(normProduct); d.categories = d.categories || [];
    const l = $("#sheetlink"); l.href = d.sheetUrl; l.hidden = false;
    $("#shopname").firstChild.textContent = d.settings["店名"] || "XIN歆星香水/流行代購";
    document.title = "賣家後台｜" + (d.settings["店名"] || "XIN歆星香水/流行代購");
    render();
  }).catch(err => toast(errMsg(err)));
}

function render() {
  const logged = !!(A.token && A.data);
  $("#view-login").hidden = logged; $("#tabs").hidden = !logged;
  ["orders", "products", "settings", "traffic"].forEach(v => $("#view-" + v).hidden = !logged || A.view !== v);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === A.view));
  if (!logged) return;
  ({ orders: renderOrders, products: renderProducts, settings: renderSettings, traffic: renderTraffic })[A.view]();
}

// 每天有幾個人來逛：人數是不同的瀏覽器，次數是打開賣場的次數
function renderTraffic() {
  const box = $("#view-traffic");
  box.innerHTML = `<div class="panel"><h3>逛網站人數</h3><p class="hint">讀取中…</p></div>`;
  call("trafficStats", { days: 30 }).then(t => {
    if (A.view !== "traffic") return;
    const ds = t.days, last = ds.length - 1, sum = (a, k) => a.reduce((n, x) => n + x[k], 0);
    const max = Math.max(1, ...ds.map(x => x.visitors));
    const card = (label, v, sub) => `<div class="stat"><span>${label}</span><b>${money(v)}</b><span class="hint">${sub}</span></div>`;
    box.innerHTML = `<div class="summary">
        ${card("今天", ds[last].visitors, `人進入・共 ${money(ds[last].views)} 次進入`)}
        ${card("昨天", ds[last - 1] ? ds[last - 1].visitors : 0, `人進入・共 ${money(ds[last - 1] ? ds[last - 1].views : 0)} 次進入`)}
        ${card("近 7 天", sum(ds.slice(-7), "visitors"), "人次進入（每天人數相加）")}
        ${card("近 30 天", t.uniqueVisitors, "位不同的訪客進入")}
      </div>
      <div class="panel"><h3>每天人數（近 30 天）</h3>
        <div style="display:flex;flex-direction:column;gap:6px">${ds.slice().reverse().map(x => `<div style="display:flex;align-items:center;gap:10px">
          <span class="hint" style="width:52px;flex:none">${x.date.slice(5).replace("-", "/")}</span>
          <div style="flex:1;background:var(--line);height:10px"><div style="width:${x.visitors / max * 100}%;height:100%;background:var(--brand)"></div></div>
          <span style="width:150px;flex:none;text-align:right">${x.visitors} 人進入・${x.views} 次進入</span></div>`).join("")}</div>
        <p class="hint" style="margin-top:12px">「人進入」是不同的手機或電腦，同一個人一天來好幾次只算 1 人；「次進入」是打開賣場的次數。你登入後台的這個瀏覽器不會被算進去。</p>
        <div class="actions"><button class="btn small ghost" id="treload">重新整理</button></div></div>`;
    $("#treload").onclick = renderTraffic;
  }).catch(err => { box.innerHTML = `<div class="panel"><h3>逛網站人數</h3><p class="err">${esc(errMsg(err))}</p></div>`; });
}

function renderOrders() {
  const d = A.data, live = d.orders.filter(o => o.status !== "已取消");
  const sum = st => live.filter(o => o.status === st).reduce((a, o) => a + o.total, 0);
  const pick = {};
  // 運費、優惠碼、滿額折扣那幾列不是商品，不算進叫貨（滿額贈品有規格「贈品」，要算進叫貨）
  const isCharge = i => !i.variant && /^(運費|優惠碼|滿額折扣)/.test(i.title);
  live.forEach(o => o.items.filter(i => !isCharge(i)).forEach(i => { pick[i.title] = pick[i.title] || {}; pick[i.title][i.variant] = (pick[i.title][i.variant] || 0) + i.qty; }));
  const pickText = Object.keys(pick).map(t => `【${t}】\n` + Object.keys(pick[t]).map(v => `  ${v} × ${pick[t][v]}`).join("\n")).join("\n");
  const rows = d.orders.filter(o => A.filter === "全部" || o.status === A.filter);
  $("#view-orders").innerHTML = `<div class="summary">
      <div class="stat"><b>${live.length}</b><span>筆訂單</span></div>
      <div class="stat"><b>NT$${money(live.reduce((a, o) => a + o.total, 0))}</b><span>訂單總額</span></div>
      <div class="stat"><b>NT$${money(sum("待對帳"))}</b><span>已回報、待對帳</span></div>
      <div class="stat"><b>NT$${money(sum("待付款"))}</b><span>尚未付款</span></div></div>
    <div class="panel"><h3>叫貨總表</h3>${pickText ? `<pre class="copybox">${esc(pickText)}</pre><div class="actions"><button class="btn small ghost" id="cppick">複製叫貨總表</button></div>` : `<p class="hint">有訂單後會自動加總每個規格要叫幾件（不含已取消）。</p>`}</div>
    <div class="panel"><div class="actions" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">訂單</h3>
      <div class="actions"><select id="flt" aria-label="篩選狀態" style="width:auto">${["全部"].concat(d.statuses).map(f => `<option ${f === A.filter ? "selected" : ""}>${f}</option>`).join("")}</select><button class="btn small ghost" id="reload">重新整理</button></div></div>
      ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>編號</th><th>時間</th><th>收件人</th><th>LINE</th><th>手機</th><th>商品</th><th>金額</th><th>取貨</th><th>末五碼</th><th>狀態</th><th></th></tr></thead><tbody>
      ${rows.map(o => `<tr><td>${esc(o.orderNo)}</td><td>${esc(o.time)}</td><td>${esc(o.name)}</td><td>${esc(o.line)}${o.lineId ? ` <span class="chip">LINE 登入</span>` : ""}</td><td>${esc(o.phone)}</td>
        <td class="wrap">${o.items.map(i => `${esc(i.title)}・${esc(i.variant)} × ${i.qty}`).join("<br>")}${o.note ? `<div class="hint">備註：${esc(o.note)}</div>` : ""}</td>
        <td>NT$${money(o.total)}</td><td>${esc(o.pickup)}</td><td>${o.last5 ? `<b>${esc(o.last5)}</b>` : "—"}</td>
        <td><select data-no="${esc(o.orderNo)}" aria-label="訂單狀態" style="width:auto">${d.statuses.map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select></td><td><button type="button" class="btn small ghost" data-odel="${esc(o.orderNo)}" style="color:#b3261e">刪除</button></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="hint">${d.orders.length ? "這個狀態沒有訂單。" : "還沒有人下單。把買家網址貼到你的 LINE 社群或 FB 社團吧。"}</p>`}</div>`;
  const cp = $("#cppick"); if (cp) cp.onclick = () => copyText(pickText, "已複製，可以直接貼給廠商");
  $("#flt").onchange = e => { A.filter = e.target.value; renderOrders(); };
  $("#reload").onclick = () => refresh().then(() => toast("已更新"));
  document.querySelectorAll("select[data-no]").forEach(s => s.addEventListener("change", () => {
    s.disabled = true;
    call("setOrderStatus", { orderNo: s.dataset.no, status: s.value }).then(() => {
      A.data.orders.filter(x => x.orderNo === s.dataset.no).forEach(o => o.status = s.value);
      toast("已改成「" + s.value + "」"); renderOrders();
    }).catch(err => { toast(errMsg(err)); s.disabled = false; });
  }));
  // 刪除是整筆從試算表移除、救不回來，所以一定先問一次
  document.querySelectorAll("[data-odel]").forEach(b => b.addEventListener("click", () => {
    const no = b.dataset.odel, o = A.data.orders.find(x => x.orderNo === no);
    if (!confirm(`確定要刪除訂單 ${no}${o && o.name ? `（${o.name}）` : ""} 嗎？\n\n刪除後救不回來，適合測試單或重複下單。\n客人只是不買了，請把狀態改成「已取消」，紀錄才留得住。`)) return;
    b.disabled = true;
    call("deleteOrder", { orderNo: no }).then(() => {
      A.data.orders = A.data.orders.filter(x => x.orderNo !== no);
      toast("已刪除訂單 " + no); renderOrders();
    }).catch(err => { toast(errMsg(err)); b.disabled = false; });
  }));
}

// 後台商品列表的排序方式；選過的會記在這台瀏覽器
const PSORTS = {
  "預設排序": null,
  "最新上架": (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
  "最早上架": (a, b) => (a.createdAt || 0) - (b.createdAt || 0),
  "價格低到高": (a, b) => a.price - b.price,
  "價格高到低": (a, b) => b.price - a.price,
  "賣出最多": (a, b) => (b.sold || 0) - (a.sold || 0),
  "名稱": (a, b) => a.title.localeCompare(b.title, "zh-Hant")
};
function psortNow() {
  if (!A.psort) { try { A.psort = localStorage.getItem("xin_psort"); } catch (_) {} }
  return PSORTS.hasOwnProperty(A.psort) ? A.psort : "預設排序";
}

function renderProducts() {
  const p = A.editing || {};
  // 照片清單在畫面上增刪，按儲存才寫回試算表
  A.photos = A.photos && A.photosFor === (p.id || "") ? A.photos : (p.images || []).slice();
  A.photosFor = p.id || "";
  $("#view-products").innerHTML = `<div class="panel"><h3>${p.id ? "編輯商品" : "上架新商品"}</h3>
    <form id="pf">
      <div class="field"><label for="p-title">商品名稱</label><input id="p-title" required value="${esc(p.title || "")}" placeholder="例：CHLOE 玫瑰晨曦 香精 30ML"></div>
      <div class="row2">
        <div class="field"><label for="p-price">價格（NT$）</label><input id="p-price" type="number" min="0" required value="${esc(p.price == null ? "" : p.price)}"></div>
        <div class="field"><label for="p-cat">分類（可不填）</label><input id="p-cat" list="catlist" maxlength="20" value="${esc(p.category || "")}" placeholder="例：現貨、預購、公司貨">
          <datalist id="catlist">${(A.data.categories || []).map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
      </div>
      <div class="field"><label for="p-var">規格與庫存</label><input id="p-var" required value="${esc(p.variantsText || "")}" placeholder="30ml:3:3999, 50ml:2:5200">
        <span class="hint">寫「規格:數量」，多個用逗號隔開；只有一種就寫「單一:10」。每個規格價格不同時，寫成「規格:數量:價格」，例如「小樣:10:350」。</span></div>
      <div class="row2">
        <div class="field"><label for="p-close">結單日（可不填）</label><input id="p-close" type="date" value="${esc(p.closeAt || "")}"></div>
        <div class="field"><label>&nbsp;</label><label class="check"><input id="p-pre" type="checkbox" ${p.preorder ? "checked" : ""}> 允許預購（庫存賣完還能繼續收單）</label></div>
      </div>
      <div class="field"><label for="p-desc">商品說明</label><textarea id="p-desc" placeholder="材質、尺寸、預計到貨時間…">${esc(p.desc || "")}</textarea></div>
      <div class="field"><label for="p-img">商品照片（最多 10 張，第一張是封面）</label>
        <div class="thumbs" id="thumbs">${A.photos.map((u, i) => `<div class="thumb"><img src="${esc(u)}" alt="" referrerpolicy="no-referrer"><button type="button" data-rm="${i}" aria-label="移除這張照片">×</button>${i ? "" : `<span class="first">封面</span>`}</div>`).join("")}</div>
        <input id="p-img" type="file" accept="image/*" multiple>
        <span class="hint" id="imghint">可以一次選好幾張。照片會存到你的 Google 雲端硬碟。</span></div>
      <div class="err" id="perr"></div>
      <div class="actions">${p.id ? `<button type="button" class="btn ghost" id="pcancel">取消編輯</button>` : ""}<button class="btn" id="psave">${p.id ? "儲存修改" : "上架"}</button></div>
    </form></div>
    <div class="panel"><h3>全部商品</h3>${A.data.products.length ? `<div class="psearch" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><input id="psearch" type="search" style="flex:1;min-width:180px" placeholder="搜尋商品名稱、分類…" aria-label="搜尋商品" value="${esc(A.pq || "")}"><select id="pstate" style="width:auto" aria-label="篩選上下架">${["全部", "上架中", "已下架"].map(f => `<option ${f === (A.pstate || "全部") ? "selected" : ""}>${f}</option>`).join("")}</select><select id="psort" style="width:auto" aria-label="排序">${Object.keys(PSORTS).map(f => `<option ${f === psortNow() ? "selected" : ""}>${f}</option>`).join("")}</select><span class="hint" id="pcount"></span></div><div class="plist">${A.data.products.map((x, i) => `<div class="pitem" data-q="${esc((x.title + " " + (x.category || "")).toLowerCase())}" data-on="${x.active ? 1 : 0}" data-i="${i}">
      <div class="ph">${photo(x, true)}</div><div class="grow"><b>${esc(x.title)}</b>
      <div class="hint">${x.category ? esc(x.category) + "・" : ""}${x.variants.map(v => `${esc(v.name)} $${money(v.price)}${v.sold ? ` 賣出${v.sold}` : ""}${v.stockLeft ? `${v.sold ? "／" : " "}剩${v.stockLeft}` : ""}`).join("、")}</div></div>
      ${x.preorder ? `<span class="chip pre">預購</span>` : ""}
      <span class="chip ${x.active ? "" : "off"}">${x.active ? (x.closed ? "已結單" : "上架中") : "已下架"}</span>
      <button class="btn small ghost" data-edit="${esc(x.id)}">編輯</button>
      <button class="btn small ghost" data-toggle="${esc(x.id)}">${x.active ? "下架" : "重新上架"}</button>
      <button class="btn small ghost" data-del="${esc(x.id)}" style="color:#b3261e">刪除</button></div>`).join("")}</div>` : `<p class="hint">還沒有商品，用上面的表單新增第一件。</p>`}</div>`;
  // 商品多的時候用關鍵字和上下架狀態篩選，只隱藏畫面上的項目
  const filterList = () => {
    const words = (A.pq || "").toLowerCase().split(/\s+/).filter(Boolean), st = A.pstate || "全部";
    let shown = 0;
    document.querySelectorAll(".plist .pitem").forEach(el => {
      const ok = words.every(w => el.dataset.q.includes(w)) && (st === "全部" || (st === "上架中") === (el.dataset.on === "1"));
      el.style.display = ok ? "" : "none"; if (ok) shown++;
    });
    const n = $("#pcount"); if (n) n.textContent = `${shown} / ${A.data.products.length} 件`;
  };
  // 排序只搬動畫面上的項目，不重畫，正在編輯的表單不會被清掉
  const sortList = () => {
    const list = $(".plist"), cmp = PSORTS[psortNow()];
    if (!list) return;
    const P = A.data.products, items = [...list.children];
    items.sort((a, b) => (cmp ? cmp(P[a.dataset.i], P[b.dataset.i]) : 0) || a.dataset.i - b.dataset.i).forEach(el => list.appendChild(el));
  };
  const ps = $("#psearch"); if (ps) { ps.oninput = () => { A.pq = ps.value; filterList(); }; $("#pstate").onchange = e => { A.pstate = e.target.value; filterList(); }; $("#psort").onchange = e => { A.psort = e.target.value; try { localStorage.setItem("xin_psort", A.psort); } catch (_) {} sortList(); }; sortList(); filterList(); }
  const c = $("#pcancel"); if (c) c.onclick = () => { A.editing = null; A.photos = null; renderProducts(); };
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { A.editing = A.data.products.find(x => x.id === b.dataset.edit); A.photos = null; renderProducts(); scrollTo({ top: 0, behavior: "smooth" }); });
  // 移除照片時保留表單上已經打的字
  const keep = () => ["p-title", "p-price", "p-cat", "p-var", "p-close", "p-desc"].reduce((o, id) => (o[id] = $("#" + id).value, o), { pre: $("#p-pre").checked });
  document.querySelectorAll("#thumbs [data-rm]").forEach(b => b.onclick = () => {
    const k = keep(); A.photos.splice(+b.dataset.rm, 1); renderProducts();
    Object.keys(k).forEach(id => { if (id === "pre") $("#p-pre").checked = k.pre; else $("#" + id).value = k[id]; });
  });
  // 刪除是整列移除、救不回來，所以一定先問一次
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const x = A.data.products.find(y => y.id === b.dataset.del);
    if (!confirm(`確定要刪除「${x.title}」嗎？\n\n刪除後救不回來；只想暫時不賣，請按「下架」。\n已經下過的訂單不會受影響。`)) return;
    b.disabled = true;
    call("deleteProduct", { id: x.id }).then(() => { if (A.editing && A.editing.id === x.id) { A.editing = null; A.photos = null; } return refresh(); })
      .then(() => toast("已刪除")).catch(err => { toast(errMsg(err)); b.disabled = false; });
  });
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const x = A.data.products.find(y => y.id === b.dataset.toggle); b.disabled = true;
    call("setProductActive", { id: x.id, active: !x.active }).then(refresh).then(() => toast(x.active ? "已下架" : "已重新上架"))
      .catch(err => { toast(errMsg(err)); b.disabled = false; });
  });
  $("#pf").addEventListener("submit", e => {
    e.preventDefault(); $("#psave").disabled = true; $("#perr").textContent = "";
    const files = [...$("#p-img").files].slice(0, Math.max(0, 10 - A.photos.length));
    // 一張一張上傳，免得 Apps Script 同時處理太多張
    const uploads = files.reduce((chain, f, i) => chain.then(list => {
      $("#imghint").textContent = `照片上傳中…（${i + 1}/${files.length}）`;
      return resize(f).then(url => call("uploadImage", { dataUrl: url, filename: f.name })).then(u => list.concat(u));
    }), Promise.resolve([]));
    uploads.then(added => call("saveProduct", { product: { id: p.id, title: $("#p-title").value.trim(), price: $("#p-price").value,
        category: $("#p-cat").value.trim(), preorder: $("#p-pre").checked, closeAt: $("#p-close").value,
        variants: $("#p-var").value.trim(), desc: $("#p-desc").value, images: A.photos.concat(added), active: p.id ? p.active : true } }))
      .then(() => { toast(p.id ? "已儲存" : "已上架！"); A.editing = null; A.photos = null; return refresh(); })
      .catch(err => { $("#perr").textContent = errMsg(err); $("#psave").disabled = false; });
  });
}

// shrink photos before upload so they load fast on phones
function resize(file) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = () => rej(new Error("讀不到這張照片"));
    r.onload = () => {
      const im = new Image(); im.onerror = () => rej(new Error("這個檔案不是圖片"));
      im.onload = () => {
        const s = Math.min(1, 1200 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.85));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function renderSettings() {
  const s = A.data.settings;
  const f = (k, label, ph, ta) => `<div class="field"><label for="s-${k}">${label}</label>${ta ? `<textarea id="s-${k}" placeholder="${esc(ph)}">${esc(s[k])}</textarea>` : `<input id="s-${k}" value="${esc(s[k])}" placeholder="${esc(ph)}">`}</div>`;
  $("#view-settings").innerHTML = `<div class="panel" id="bpanel"></div><div class="panel"><h3>收款帳號</h3>
    <form id="sf">
      <div class="row2">${f("銀行", "銀行名稱與代碼", "例：中國信託 822")}${f("帳號", "帳號", "例：1234-5678-9012")}</div>
      <div class="row2">${f("戶名", "戶名（可不填）", "")}${f("付款說明", "付款說明（可不填）", "例：結單後 3 天內匯款")}</div>
      <h3 style="margin-top:12px">商店</h3>
      ${f("店名", "店名", "XIN歆星香水/流行代購")}
      ${f("公告", "商品頁最上方的公告（可不填）", "例：本週五結單，下週三面交", true)}
      ${f("取貨方式", "取貨方式（用逗號隔開）", "面交, 7-11 賣貨便, 全家好賣+, 宅配")}
      <h3 style="margin-top:12px">超商選門市（綠界）</h3>
      <div class="row2">${f("綠界商店代號", "綠界商店代號（MerchantID）", "例：3001234")}${f("網站網址", "買家網頁網址", "https://xinperfume.github.io/")}</div>
      <p class="hint">取貨方式裡有「超商、7-11、全家、萊爾富、OK」字樣的，結帳時會出現「選擇門市」按鈕，開啟超商地圖選店。綠界商店代號空著時是測試模式（可以試選門市，但不是正式帳號）。</p>
      <h3 style="margin-top:12px">LINE 登入</h3>
      ${f("LINE頻道ID", "LINE Login 頻道的 Channel ID（10 位數字）", "例：2001234567")}
      <p class="hint">填了以後，買家一定要用 LINE 登入才能下單。網頁的 config.js 也要填 LIFF ID，兩個要一起設定。</p>
      <div class="actions"><button class="btn" id="ssave">儲存</button></div>
    </form>
    <p class="hint">管理密碼請直接在 Google 試算表的「設定」工作表修改。</p></div>`;
  $("#sf").addEventListener("submit", e => {

    call("saveSettings", { settings: data }).then(() => { Object.assign(A.data.settings, data); toast("已儲存"); })
      .catch(err => toast(errMsg(err))).then(() => { $("#ssave").disabled = false; });
  });

// 首頁橫幅：在畫面上增刪、排序、設定連結，按「儲存橫幅」才整批寫回試算表
const BANNER_MAX = 6;
function renderBanners() {
  const el = $("#bpanel"), B = A.banners, P = A.data.products, cats = A.data.categories || [];
  if (!el) return;
  const opts = b => b.type === "product"
    ? P.map(x => `<option value="${esc(x.id)}" ${x.id === b.target ? "selected" : ""}>${esc(x.title)}${x.active ? "" : "（已下架）"}</option>`).join("")
    : cats.map(c => `<option ${c === b.target ? "selected" : ""}>${esc(c)}</option>`).join("");
  el.innerHTML = `<h3>首頁橫幅</h3>
    <p class="hint">賣場最上面的輪播圖，最多 ${BANNER_MAX} 張，建議用 2:1 的橫圖（例如 1200×600）。圖上不要放售價。沒有橫幅時賣場不會顯示這一塊。</p>
    <div class="blist">${B.map((b, i) => `<div class="bitem">
      <img src="${esc(b.image)}" alt="" referrerpolicy="no-referrer">
      <div class="grow">
        <div class="row2"><select data-bt="${i}" aria-label="點了連到">${[["", "點了不跳"], ["product", "連到商品"], ["category", "連到分類"]].map(([v, t]) => `<option value="${v}" ${v === (b.type || "") ? "selected" : ""}>${t}</option>`).join("")}</select>
          ${b.type ? `<select data-bg="${i}" aria-label="連到哪裡">${opts(b)}</select>` : ""}</div>
        <input data-bn="${i}" value="${esc(b.title || "")}" maxlength="40" placeholder="說明文字（給看不到圖的人，可不填）"></div>
      <div class="bbtns"><button type="button" class="btn small ghost" data-bm="${i}" data-d="-1" ${i ? "" : "disabled"} aria-label="往前">↑</button><button type="button" class="btn small ghost" data-bm="${i}" data-d="1" ${i < B.length - 1 ? "" : "disabled"} aria-label="往後">↓</button><button type="button" class="btn small ghost" data-bx="${i}" style="color:#b3261e">刪除</button></div></div>`).join("") || `<p class="hint">目前沒有橫幅。</p>`}</div>
    ${B.length < BANNER_MAX ? `<div class="field"><label for="b-img">新增橫幅圖片</label><input id="b-img" type="file" accept="image/*" multiple><span class="hint" id="bhint"></span></div>` : ""}
    <div class="actions"><button type="button" class="btn" id="bsave">儲存橫幅</button></div>`;
  el.querySelectorAll("[data-bt]").forEach(s => s.onchange = () => {
    const b = B[+s.dataset.bt]; b.type = s.value;
    b.target = b.type === "product" ? (P[0] || {}).id || "" : b.type === "category" ? cats[0] || "" : "";
    renderBanners();
  });
  el.querySelectorAll("[data-bg]").forEach(s => s.onchange = () => { B[+s.dataset.bg].target = s.value; });
  el.querySelectorAll("[data-bn]").forEach(s => s.oninput = () => { B[+s.dataset.bn].title = s.value; });
  el.querySelectorAll("[data-bm]").forEach(b => b.onclick = () => {
    const i = +b.dataset.bm, j = i + +b.dataset.d;
    [B[i], B[j]] = [B[j], B[i]]; renderBanners();
  });
  el.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => { if (confirm("移除這張橫幅？按「儲存橫幅」後才會生效。")) { B.splice(+b.dataset.bx, 1); renderBanners(); } });
  const fi = $("#b-img");
  if (fi) fi.onchange = () => {
    const files = [...fi.files].slice(0, BANNER_MAX - B.length);
    fi.disabled = true;
    files.reduce((chain, f, i) => chain.then(() => {
      $("#bhint").textContent = `圖片上傳中…（${i + 1}/${files.length}）`;
      return resize(f).then(url => call("uploadImage", { dataUrl: url, filename: f.name })).then(u => { B.push({ image: u, type: "", target: "", title: "" }); });
    }), Promise.resolve()).then(() => { renderBanners(); toast("圖片已加入，記得按「儲存橫幅」"); })
      .catch(err => { $("#bhint").textContent = errMsg(err); fi.disabled = false; });
  };
  $("#bsave").onclick = () => {
    $("#bsave").disabled = true;
    call("saveBanners", { banners: B }).then(list => { A.data.banners = list; A.banners = list.map(b => Object.assign({}, b)); renderBanners(); toast("橫幅已儲存，賣場重新整理就會看到"); })
      .catch(err => { toast(errMsg(err)); $("#bsave").disabled = false; });
  };
}

render(); if (A.token) refresh();
